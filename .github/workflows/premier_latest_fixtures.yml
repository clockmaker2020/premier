name: Update Latest Fixtures

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"  # ✅ 30분마다 실행

jobs:
  update-latest-fixtures:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: ✅ 저장소 체크아웃
        uses: actions/checkout@v3

      - name: ✅ Python 설정
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: ✅ 의존성 설치
        run: |
          echo "📦 requirements.txt 설치 중..."
          pip install -r requirements.txt || echo "⚠️ requirements.txt 없음, 건너뜀"

      - name: ✅ API 키 설정
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: echo "🔐 API_KEY=${API_KEY}" > .env

      - name: ✅ latest_fixtures.py 실행
        run: |
          echo "⚽ latest_fixtures.py 실행 시작"
          python scripts/premier_latest_fixtures.py

      - name: ✅ JSON 파일 확인
        run: |
          echo "📄 JSON 미리보기:"
          head -n 30 data/latest_fixtures.json || echo "⚠️ latest_fixtures.json 없음"

      - name: ✅ Git 상태 확인
        run: |
          git status
          git diff --color data/latest_fixtures.json || echo "⚠️ 변경사항 없음"

      - name: ✅ 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: ✅ 변경 사항 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions@users.noreply.github.com"

          if [ -f data/latest_fixtures.json ]; then
            git add data/latest_fixtures.json
            git commit --allow-empty -m "🔄 latest_fixtures.json 업데이트 (자동)" || echo "⚠️ 커밋할 변경 없음"
            git push origin HEAD:${{ github.ref }} || echo "⚠️ 푸시 실패"
          else
            echo "⚠️ 생성된 JSON 파일 없음. 커밋 생략"
          fi

